# configs/llama_factory/umichslm_reasoning_warmup.yaml

### Model Configuration ###
model_name_or_path: ./checkpoints/umichslm-base  # Path to pretrained model [TODO might want to change this]
trust_remote_code: true  # Required for custom model

### Data Configuration ###
# Point to the directory containing dataset_info.json
dataset_dir: ./configs/llama_factory
dataset: openmath2  # Dataset name (registered in LLaMA Factory)
template: default  # Chat template
cutoff_len: 2048  # Maximum sequence length
preprocessing_num_workers: 8

### Training Stage ###
stage: sft
do_train: true
finetuning_type: full  # Options: full, lora, freeze

### Output Configuration ###
output_dir: ./outputs/umichslm-reasoning-warmup
logging_dir: ./logs/umichslm-reasoning-warmup
overwrite_output_dir: true

### Training Hyperparameters ###
# Shorter than general SFT — warmup should be brief?
num_train_epochs: 1.0
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
# Same LR as SFT is fine for warmup
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

### Optimization ###
bf16: true  # Use bfloat16 mixed precision
gradient_checkpointing: true  # Save memory
flash_attn: fa2  # Use Flash Attention 2
optim: adamw_torch  # Optimizer

### Logging and Saving ###
logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 3
report_to: wandb

### Evaluation ###
do_eval: true
evaluation_strategy: steps
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

### Misc ###
seed: 42
dataloader_num_workers: 4
ddp_timeout: 180000000
