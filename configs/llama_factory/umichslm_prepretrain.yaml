# UMichSLM pretraining config for LLaMA Factory.
# This version targets the shared 1B toy mixture dataset for scaling/pretraining runs.
#
# Typical usage:
#   1. Create an initialized model checkpoint:
#      python scripts/pretrain.py --size qwen3_like_small --dry_run --output_dir ./outputs/bootstrap --run_name toy1b_qwen3_like_small_init --tokenizer_path /path/to/data
#   2. Train:
#      llamafactory-cli train configs/llama_factory/umichslm_pretrain.yaml

### Model Configuration ###
# This should be a fresh initialized checkpoint, not an already-trained model.
# The bootstrap checkpoint is expected to bundle the cached SmolLM2 tokenizer above.
model_name_or_path: ./outputs/bootstrap/models/toy1b_qwen3_like_small_init
trust_remote_code: true

### Data Configuration ###
# Where dataset_info.json lives
dataset_dir: /path/to/data
dataset: shuffle_dyck_k
cutoff_len: 1024
preprocessing_num_workers: 16

### Training Stage ###
stage: pt  # Pretraining (next-token prediction)
do_train: true
finetuning_type: full

### Output Configuration ###
output_dir: ./outputs/umichslm-prepretrain
logging_dir: ./outputs/umichslm-prepretrain/logs
overwrite_output_dir: false
run_name: umichslm_prepretrain_shuffle_dyck_k

### Training Hyperparameters ###
per_device_train_batch_size: 4
# per_device_eval_batch_size: 8
gradient_accumulation_steps: 8  # Effective batch size = 8 * 16 * num_gpus
learning_rate: 1.0e-3
# num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
max_grad_norm: 1.0

# For a 1B-token style run, set this from your token budget calculation.
# Adjust after you decide GPU count / global batch.
max_steps: 500

### Optimization ###
bf16: true
gradient_checkpointing: true
flash_attn: fa2
optim: adamw_torch

# For multi-GPU training with fused optimizer:
# optim: adamw_torch_fused

### Logging and Saving ###
logging_steps: 10
# Required by scripts/throughput_compare.py to pull tokens/sec out of
# trainer_state.json for the head-to-head LF-vs-torchtitan comparison.
include_tokens_per_second: true
include_num_input_tokens_seen: true
save_steps: 500
eval_steps: 500
save_total_limit: 1

report_to: wandb
# Set WANDB_PROJECT / WANDB_ENTITY in the environment instead of adding
# unsupported keys here. Recent LLaMA Factory versions pass this config
# through HfArgumentParser, which rejects unknown YAML fields.

### Evaluation ###
do_eval: false

### Distributed Training ###
# For multi-GPU training with DeepSpeed:
# deepspeed: configs/llama_factory/ds_config_zero2.json
# ddp_find_unused_parameters: false

# Note: If you get "ModuleNotFoundError: No module named 'ray.train'",
# you can either:
# 1. Install Ray: pip install "ray[train,torch]"
# 2. Or use single-GPU training (Ray is not required)
# 3. Or use DeepSpeed for multi-GPU (see above)

### Misc ###
seed: 42
dataloader_num_workers: 8
dataloader_pin_memory: true
