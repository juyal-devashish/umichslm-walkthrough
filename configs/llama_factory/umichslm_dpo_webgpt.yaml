# UMichSLM DPO on WebGPT Comparisons (RAG-style).
# Both chosen and rejected answers are wrapped in the 6-token RAG schema
# (<retrieve>/<result>/<answer>/<cite>), so the DPO signal is human preference
# between two grounded responses — not grounded vs. ungrounded.
#
# Prepare data first:
#   python scripts/dpo_data/prepare_webgpt.py \
#       --output_dir /path/to/data
#
# Single run:
#   llamafactory-cli train configs/llama_factory/umichslm_dpo_webgpt.yaml \
#       model_name_or_path=<SFT_WINNER_DIR> \
#       ref_model=<SFT_WINNER_DIR> \
#       dpo_beta=0.1 \
#       output_dir=/path/to/data
#
# β sweep: copy local-slurm/dpo_beta_sweep.sh, change dataset to
#          umichslm_dpo_webgpt_{train,val} and config to this file.

### Model Configuration ###
model_name_or_path: /path/to/data
trust_remote_code: true

### Reference Model ###
ref_model: /path/to/data

### Data Configuration ###
dataset_dir: ./configs/llama_factory
dataset: umichslm_dpo_webgpt_train
eval_dataset: umichslm_dpo_webgpt_val
template: default
cutoff_len: 2048
preprocessing_num_workers: 8

### Training Stage ###
stage: dpo
do_train: true
finetuning_type: full

### DPO Hyperparameters ###
dpo_beta: 0.1            # CLI override per-run for sweep
dpo_loss: sigmoid
dpo_ftx: 0.0

### Output Configuration ###
output_dir: /path/to/data
logging_dir: /path/to/data
overwrite_output_dir: true

### Training Hyperparameters ###
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-7
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

### Optimization ###
bf16: true
gradient_checkpointing: true
flash_attn: fa2
optim: adamw_torch

### Logging and Saving ###
logging_steps: 20
save_steps: 200
eval_steps: 200
save_total_limit: 3
report_to: wandb
run_name: umichslm-dpo-webgpt

### Evaluation ###
do_eval: true
evaluation_strategy: steps
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

### Misc ###
seed: 42
dataloader_num_workers: 4
ddp_timeout: 180000000
