# UMichSLM Zero-Centered RMSNorm (Gemma2-style) variant.
# Mirrors local-slurm/small_zcrmsnorm_lr3e4_fineweb-1B.sh: per_device=32, grad_accum=4.

[job]
output_dir = "./outputs/titan/small_zcrmsnorm_lr3e4"
run_name = "titan_small_zcrmsnorm_lr3e4"
seed = 42

[model]
size = "small"
overrides = { num_key_value_heads = 4, use_zero_centered_rmsnorm = true }

[data]
dataset_dir = "/shared/4/projects/umich-slm/data/fineweb-edu-1B"
train_arrow = "dataset/train.arrow"
val_arrow   = "dataset/validation.arrow"
text_column = "text"
seq_len = 2048
num_workers = 8

[optimizer]
name = "adamw"
lr = 3.0e-4
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1.0e-8

[lr_scheduler]
name = "warmup_stable_decay"
warmup_steps = 191
stable_steps = 3242
decay_steps  = 381
min_lr_ratio = 0.0
decay_type   = "cosine"

[training]
per_device_batch_size = 32
gradient_accumulation_steps = 4
max_steps = 3814
max_grad_norm = 1.0
bf16 = true
gradient_checkpointing = true
torch_compile = false
float8 = false

[parallelism]
dp_replicate_degree = 1

[logging]
log_every = 50
report_to = "wandb"
wandb_project = "umich-slm-titan"
wandb_tags = ["benchmark_v1", "zcrmsnorm"]
metrics_jsonl = "metrics.jsonl"

[checkpoint]
save_every = 500
keep_last = 5
format = "hf"
eval_every = 1000
