# UMichSLM stacking pilot — 50M Config B (DeltaNet+MLA), all 3 stages in one launch.
#
# This config drives the in-process torchtitan staging loop. Set
# [staging].mode = "in_process" so the launcher dispatches to
# torchtitan_train/staging_loop.py, which trains stage 1, calls
# umich_slm.staging.transition between stages, and trains stages 2/3.
#
# Pre-reqs:
#   * StageSpec JSONs at configs/torchtitan/stacking/specs/stack_50m_b_dn_stage{1,2,3}.json
#     (generated by `python scripts/generate_stack_specs.py --pilot stack_50m_b_dn ...`)
#   * Tokenized dataset at [data].dataset_dir.
#
# Run:
#   torchrun --nproc_per_node=4 torchtitan_train/launch.py \
#       configs/torchtitan/stacking/stack_50m_b_dn.toml

[job]
output_dir = "./outputs/stacking/stack_50m_b_dn"
run_name   = "stack_50m_b_dn"
seed       = 42

[model]
size = "stack_50m_b_dn"
# Optional: vocab_size override is auto-injected from the tokenizer at runtime.
overrides = {}

[data]
dataset_dir = "/shared/4/projects/umich-slm/data/fineweb-edu-1B"
train_arrow = "dataset/train.arrow"
val_arrow   = "dataset/validation.arrow"
seq_len     = 2048
text_column = "text"
num_workers = 8

[optimizer]
name = "adamw"
lr = 3.0e-4
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1.0e-8

[lr_scheduler]
name = "warmup_stable_decay"
# These are PER-STAGE numbers — the staging loop overrides max_steps per stage
# from [staging].max_steps_per_stage. Warmup applies at the start of each stage.
warmup_steps = 50
stable_steps = 100
decay_steps  = 50
min_lr_ratio = 0.0
decay_type   = "cosine"

[training]
per_device_batch_size = 16
gradient_accumulation_steps = 4
max_steps = 200  # Overridden per-stage by [staging].max_steps_per_stage
max_grad_norm = 1.0
bf16 = true
gradient_checkpointing = true
deltanet_compile_safe = true

[parallelism]
dp_replicate_degree = 1

[logging]
log_every = 10
report_to = "wandb"
wandb_project = "umich-slm-stacking"
wandb_tags = ["stacking", "50m_b", "deltanet_mla"]
metrics_jsonl = "metrics.jsonl"

[checkpoint]
save_every = 100
keep_last = 2
format = "hf"

[staging]
mode = "in_process"
stages = [
    "configs/torchtitan/stacking/specs/stack_50m_b_dn_stage1.json",
    "configs/torchtitan/stacking/specs/stack_50m_b_dn_stage2.json",
    "configs/torchtitan/stacking/specs/stack_50m_b_dn_stage3.json",
]
init_strategy = "exact_copy"
run_probes_between_stages = false

# 5/25/70 stage allocation. Adjust to match your TPR-350 token budget for
# this pilot. Example below assumes a 200-step total budget (placeholder).
max_steps_per_stage = [10, 50, 140]
lr_per_stage = [3.0e-4, 1.5e-4, 1.0e-4]
