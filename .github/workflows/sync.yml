name: Weekly snapshot sync

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the gates and report, publish nothing"
        type: boolean
        default: false
      lag_days:
        description: "Minimum age of the source commit, in days"
        default: "14"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNC_PRIVATE_TERMS: ${{ vars.SYNC_PRIVATE_TERMS }}
      SYNC_NAME_REPLACEMENTS: ${{ vars.SYNC_NAME_REPLACEMENTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          token: ${{ secrets.UPSTREAM_READ_TOKEN }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync tests
        run: python sync/test_sync.py

      - name: Build snapshot
        id: snap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"; fi
          python sync/snapshot.py sync --upstream upstream --target . \
            --lag-days "${{ inputs.lag_days || '14' }}" $flags

      - name: Scan repository
        if: steps.snap.outputs.changed == 'true'
        run: |
          python sync/snapshot.py scan --target .
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner
          rm -f gitleaks

      - name: Open and merge pull request
        if: steps.snap.outputs.changed == 'true'
        run: |
          branch="sync/${{ steps.snap.outputs.sha }}"
          git config user.name "juyal-devashish"
          git config user.email "juyal-devashish@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Sync snapshot from upstream ${{ steps.snap.outputs.sha }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Sync snapshot from upstream ${{ steps.snap.outputs.sha }}" \
            --body "Automated weekly snapshot. Revert this pull request to roll it back."
          gh pr merge "$branch" --squash --delete-branch

      - name: Report failure
        if: failure()
        run: |
          gh issue create --title "Weekly sync stopped" \
            --body "A gate or step failed; nothing was published. See the run log for rule names and file lines: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
