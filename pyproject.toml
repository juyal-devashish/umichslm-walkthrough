[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umich-slm"
version = "0.1.0"
description = "A modern transformer architecture with SwiGLU, RoPE, RMSNorm, and Flash Attention 2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "UMich SLM Team"}
]
keywords = ["transformers", "deep-learning", "nlp", "pytorch", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "tokenizers>=0.15.0",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "flash-attn>=2.5.0",
    "flash-linear-attention>=0.1.0",
    # torchtitan path: Arrow IPC dataset reader (titan/data.py) and run logging.
    # Previously undeclared -> present in the base env by luck but absent from a
    # fresh env (e.g. umich-slm-fa2), which crashed the titan loader on `import
    # pyarrow`. wandb is imported behind a try/except (falls back to metrics.jsonl)
    # but every training path logs to it, so declare it.
    "pyarrow>=14.0.0",
    "wandb>=0.16.0",
    # numpy and scipy were undeclared and present by luck via torch/transformers.
    # umich_slm.scaling imports scipy.optimize, scipy.cluster and scipy.spatial at
    # module level (least-squares multi-start, basin clustering), so the scaling-law
    # fitter is a hard import failure without it rather than a degraded path.
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # tomllib is stdlib on py>=3.11; tomli is the backport for older interpreters.
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn>=2.5.0",
]
fla = [
    "flash-linear-attention>=0.1.0",
]
mamba = [
    "mamba-ssm>=2.0.0",
    "causal-conv1d>=1.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "umich-slm[flash-attn,fla,mamba,dev]",
]

[project.urls]
Homepage = "https://github.com/umich/umich-slm"
Documentation = "https://github.com/umich/umich-slm#readme"
Repository = "https://github.com/umich/umich-slm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"umich_slm" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.ruff_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["umich_slm"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    # tests/test_eval.py runs the REAL lm-eval-harness against GPT-2. Measured:
    # hellaswag alone exceeds 230s on one CPU thread, and the `mmlu` entry is a
    # GROUP of 57 subtasks whose limit=50 applies PER SUBTASK (~11,400 forward
    # passes at 5-shot), so that file is a multi-hour job. It also produces no
    # output while running, because pytest captures stdout -- which is why the
    # suite looked hung at ~23%. Everything else is 1248 passed / 34 skipped in
    # 229s. Run the slow ones deliberately with:  pytest -m slow
    "slow: multi-minute or multi-hour tests, deselected by default",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
