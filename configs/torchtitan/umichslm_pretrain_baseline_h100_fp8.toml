# UMichSLM baseline GQA pretraining config — H100 fp8 + torch.compile variant.
# Mirrors umichslm_pretrain_baseline.toml; flips on float8 training and per-block
# torch.compile, both of which need Hopper+ (SM>=9.0) to be useful.
#
# Phase 5 verification target: float8 + compile should hit >=1.4× tokens/sec
# over the bf16 baseline at matched loss curve (within ±2% over 500 steps).
# Loss-curve parity is the gating check — fp8 is a numerics knob, not a
# correctness one.

[job]
output_dir = "./outputs/titan/small_baseline_lr3e4_h100_fp8"
run_name = "titan_small_baseline_lr3e4_h100_fp8"
seed = 42

[model]
size = "qwen3_like_small"
overrides = { num_key_value_heads = 4 }

[data]
dataset_dir = "/shared/4/projects/umich-slm/data/fineweb-edu-1B"
train_arrow = "dataset/train.arrow"
val_arrow   = "dataset/validation.arrow"
text_column = "text"
seq_len = 2048
num_workers = 8

[optimizer]
name = "adamw_fused"   # fused kernel exists on Hopper; reduces step overhead
lr = 3.0e-4
weight_decay = 0.1
betas = [0.9, 0.95]
eps = 1.0e-8

[lr_scheduler]
name = "warmup_stable_decay"
warmup_steps = 191
stable_steps = 3242
decay_steps  = 381
min_lr_ratio = 0.0
decay_type   = "cosine"

[training]
per_device_batch_size = 8
gradient_accumulation_steps = 16
max_steps = 3814
max_grad_norm = 1.0
bf16 = true               # bf16 master weights; float8 GEMMs only
gradient_checkpointing = true
torch_compile = true
float8 = true
deltanet_compile_safe = true

[parallelism]
dp_replicate_degree = 1

[logging]
log_every = 50
report_to = "wandb"
wandb_project = "umich-slm-titan"
wandb_tags = ["benchmark_v1", "baseline", "h100", "fp8", "compile"]
metrics_jsonl = "metrics.jsonl"

[checkpoint]
save_every = 500
keep_last = 5
format = "hf"
eval_every = 1000
